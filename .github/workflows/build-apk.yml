name: Build offline APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: offline-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native player
        run: gradle :app:compileDebugKotlin --stacktrace
      - name: Install audio validation tool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download and validate all recordings and verse timings
        run: python3 scripts/prepare_media.py
      - name: Build installable signed APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify complete offline bundle
        run: |
          python3 scripts/check_apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > permissions.txt
          if grep -q android.permission.INTERNET permissions.txt; then echo 'Unexpected Internet permission'; exit 1; fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline seeking, screen-off playback and saved-position restore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 8192
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell settings put global airplane_mode_on 1
            gradle :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Burhajy-offline-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/assets/media-manifest.json
            permissions.txt
            app/build/reports/androidTests/connected/
          compression-level: 0
          if-no-files-found: error
