name: Split APK for download
on:
  push:
    branches: [main]
    paths: [.github/workflows/split-apk-parts.yml]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build offline APK"]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  split:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Select the most recent successful APK build
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.run_id }}" ]]; then
            echo "id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
          else
            id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            test -n "$id"
            echo "id=$id" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: Burhajy-offline-APK
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.run.outputs.id }}
          path: incoming
      - name: Split the unchanged APK into transferable parts
        shell: bash
        run: |
          apk="$(find incoming -name app-debug.apk -type f -print -quit)"
          test -n "$apk"
          split -b 400000000 --numeric-suffixes=1 --suffix-length=1 "$apk" Burhajy-APK-part-
          test "$(find . -maxdepth 1 -name 'Burhajy-APK-part-*' -type f | wc -l)" -ge 2
      - uses: actions/upload-artifact@v4
        with:
          name: Burhajy-APK-part-1
          path: Burhajy-APK-part-1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Burhajy-APK-part-2
          path: Burhajy-APK-part-2
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Burhajy-APK-part-3
          path: Burhajy-APK-part-3
          compression-level: 0
          if-no-files-found: warn
